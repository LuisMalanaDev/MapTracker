name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild for Android
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build Standalone Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../CraveNav.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraveNav-APK
          path: CraveNav.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: CraveNav Standalone Android APK
          body: "Direct installable Android APK for CraveNav (Restaurants, Hotels & Live GPS Navigation)."
          files: CraveNav.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
